name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:00 UTC — catches HACS-Action drift on existing tags.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: theme
