name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:00 UTC — catches HACS-Action drift on existing tags.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: theme

  # Zentraler Security-Scan: gitleaks, TruffleHog, Trivy, Semgrep (alle blockierend).
  # Semgrep blockiert nur neue Funde. Version: Commit des Release-Tags, siehe Kommentar.
  security:
    uses: studio-prisma/github-config-security-workflow/.github/workflows/security.yml@510cea39c4ecb83fb25fdfca88649dc014eae883 # v1.1.0
    with:
      semgrep-rules: "p/security-audit"
    secrets:
      identity-pattern: ${{ secrets.IDENTITY_PATTERN }}

  # Single aggregating context for the branch ruleset. Every studio-prisma repo
  # requires exactly one check named "Gate", so the ruleset is identical everywhere
  # and jobs above can be added or renamed without touching branch protection.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [hacs, security]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "hacs=${{ needs.hacs.result }}"
          exit 1
