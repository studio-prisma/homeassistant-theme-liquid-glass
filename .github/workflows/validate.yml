name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:00 UTC — catches HACS-Action drift on existing tags.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: theme

  # Single aggregating context for the branch ruleset. Every studio-prisma repo
  # requires exactly one check named "Gate", so the ruleset is identical everywhere
  # and jobs above can be added or renamed without touching branch protection.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [hacs]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "hacs=${{ needs.hacs.result }}"
          exit 1
