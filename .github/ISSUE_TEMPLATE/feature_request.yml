name: Feature request
description: Suggest a new variant, token, snippet, or theme capability
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. To keep the theme focused, please describe **the use case** as well as the proposed feature.

        See the [Out-of-Scope section in the roadmap](https://github.com/studio-prisma/homeassistant-theme-liquid-glass#roadmap) before opening — it lists ideas already considered and consciously not pursued.

  - type: dropdown
    id: type
    attributes:
      label: Type of feature
      options:
        - New theme variant
        - New `--glass-*` token
        - New `card-mod` snippet for a specific card type
        - Performance improvement
        - Accessibility improvement
        - Documentation improvement
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use case
      description: What problem does this solve? Who needs this?
      placeholder: |
        I'm trying to ...
        Currently the theme ...
        It would help if ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed implementation (optional)
      description: How would you implement this? Code snippet / token name / variant config etc.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve the same problem you've evaluated.

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I've searched existing issues and didn't find a duplicate
          required: true
        - label: I've checked the README's "Out-of-Scope" section to make sure this isn't already declined
          required: true
