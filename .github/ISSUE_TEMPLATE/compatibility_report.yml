name: Compatibility report
description: A community card or plugin doesn't render correctly with the theme
title: "[Compat]: "
labels: ["compatibility", "needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for **plugin / community-card** compatibility issues (Mushroom, Bubble, mini-graph, Browser Mod, Kiosk Mode, UIX, etc.).

        Liquid Glass officially tests against the cards listed in the README's **Tested With / Compatibility** table. Other plugins are best-effort — but reports here help the matrix grow over time.

  - type: input
    id: plugin
    attributes:
      label: Plugin / card name
      placeholder: "e.g. UIX / button-card / lovelace-state-switch / ..."
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      placeholder: "e.g. v2.3.1"
    validations:
      required: true

  - type: input
    id: ha_core
    attributes:
      label: Home Assistant Core version
      placeholder: "e.g. 2026.5.0"
    validations:
      required: true

  - type: input
    id: theme_version
    attributes:
      label: Liquid Glass version
      placeholder: "e.g. v1.5.0"
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Which theme variant?
      options:
        - Liquid Glass (default dark)
        - Liquid Glass Auto (experimental)
        - Liquid Glass Light only
        - Liquid Glass Compact
        - Liquid Glass Sunset
        - Liquid Glass Floorplan
        - Liquid Glass Lite
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What renders wrong?
      description: How does the plugin look with vs. without the theme active? Be specific about which element is affected.
      placeholder: |
        With theme active:
        Without theme active (default HA dark):
        Expected:
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshots (with theme vs. without)
      description: Side-by-side helps a lot.
    validations:
      required: true

  - type: textarea
    id: yaml
    attributes:
      label: Minimal card YAML reproducing the issue
      render: yaml

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: Plugin works correctly under the default HA dark theme (i.e. it's not a plugin bug)
          required: true
        - label: I've installed `card-mod` via HACS
          required: true
