name: Visual bug
description: Wrong color, missing blur, white-on-white, contrast issue, layout glitch
title: "[Visual]: "
labels: ["bug", "visual", "needs-reproduction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the visual bug report. The most important info for fixing color/contrast issues is the **CSS variable** the affected element resolves to.

        See [Diagnosing issues](https://github.com/studio-prisma/homeassistant-theme-liquid-glass#diagnosing-issues) in the README for the DOM-inspect walkthrough.

  - type: input
    id: ha_core
    attributes:
      label: Home Assistant Core version
      placeholder: "e.g. 2026.5.0"
    validations:
      required: true

  - type: input
    id: theme_version
    attributes:
      label: Liquid Glass version
      placeholder: "e.g. v1.5.0"
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Which theme variant?
      options:
        - Liquid Glass (default dark)
        - Liquid Glass Auto (experimental)
        - Liquid Glass Light only
        - Liquid Glass Compact
        - Liquid Glass Sunset
        - Liquid Glass Floorplan
        - Liquid Glass Lite
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser / app
      options:
        - Chrome desktop
        - Firefox desktop
        - Safari desktop
        - Edge desktop
        - iOS Companion App
        - Android Companion App
        - Fully Kiosk / wall-tablet browser
        - Other (specify in description)
    validations:
      required: true

  - type: input
    id: affected_element
    attributes:
      label: Affected element / card type
      placeholder: "e.g. Tile card / Bubble pop-up / Sidebar / Tooltip"
    validations:
      required: true

  - type: input
    id: css_variable
    attributes:
      label: CSS variable resolving wrong (from DevTools → Computed tab)
      description: "Open DevTools → Elements → click the affected element → Computed tab → find the property (e.g. `color`, `background`) and copy the CSS variable name it resolves to (e.g. `--primary-text-color`)."
      placeholder: "e.g. --ha-card-background"

  - type: input
    id: expected_color
    attributes:
      label: Expected color / appearance
      placeholder: "e.g. dark translucent / matching surrounding cards"

  - type: input
    id: actual_color
    attributes:
      label: Actual color / appearance
      placeholder: "e.g. white-on-white / opaque cream"

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot — including DevTools panel if possible
      description: Drag-and-drop, or paste from clipboard.
    validations:
      required: true

  - type: textarea
    id: yaml
    attributes:
      label: Card YAML (minimal reproduction)
      description: Strip personal entity IDs to `light.example_1` etc.
      render: yaml

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I've installed `card-mod` via HACS (required since v1.4.0)
          required: true
        - label: I've checked DevTools Computed CSS to confirm which variable is wrong
          required: false
        - label: I've cleared my browser cache / restarted the Companion App
          required: true
