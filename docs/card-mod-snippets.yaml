# =====================================================================
# Liquid Glass — card-mod Snippets
#
# Drop-in CSS mods for popular HA cards.
# Requires: card-mod (HACS) installed.
# Each snippet uses theme variables, so it adapts automatically when
# you switch between Liquid Glass / Liquid Glass Light / Liquid Glass Compact.
# =====================================================================

# ---------------------------------------------------------------------
# 1) Universal Glass Card Base  —  the "screenshot look" recipe
#
#    SINCE v1.4.0 this snippet is bundled into the theme itself as a
#    global `card-mod-card` rule. Every card automatically gets the
#    full glass-morphism look (backdrop blur + translucent surface +
#    soft border + glass-grade shadow). You no longer need to paste
#    this snippet on every card to match the README screenshots.
#
#    History: earlier releases shipped this as per-card opt-in because
#    a global `ha-card { backdrop-filter }` rule used to break Bubble
#    Card v3 pop-up rendering (Bubble Card issue #2347). The upstream
#    fix (post-v3.2.0-beta4) moved pop-ups outside the `ha-card` tree,
#    so a global rule no longer affects them. v1.4.0 ships that rule
#    as the default — see README "What you get out of the box".
#
#    Why this snippet is still here:
#    - Copy-paste template for per-card OVERRIDES (different blur
#      strength on a single card, custom hover, etc.)
#    - Reference for users on older theme versions
#    - Yaml anchor (`&glass_card_base`) for shared overrides within a
#      single dashboard file
#
#    Per-card override usage:
#      type: tile
#      entity: light.living_room
#      card_mod:
#        style: |
#          ha-card {
#            background: var(--glass-bg);
#            backdrop-filter: var(--glass-blur);
#            -webkit-backdrop-filter: var(--glass-blur);
#            border: var(--glass-border);
#            border-radius: var(--glass-radius);
#            box-shadow: var(--glass-shadow);
#          }
# ---------------------------------------------------------------------
glass_card_base: &glass_card_base
  card_mod:
    style: |
      ha-card {
        background: var(--glass-bg);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--glass-border);
        border-radius: var(--glass-radius);
        box-shadow: var(--glass-shadow);
        transition: all var(--transition-duration) var(--transition-timing-function);
      }
      ha-card:hover {
        background: var(--glass-bg-hover);
      }

# ---------------------------------------------------------------------
# 2) Status-Glow Overlay
#    Adds a subtle directional glow when an entity is active.
#    Variants: warm / cool / violet / mint
# ---------------------------------------------------------------------
glow_warm:
  card_mod:
    style: |
      ha-card {
        background: var(--glass-bg), var(--glass-glow-warm);
        background-blend-mode: overlay;
      }

glow_cool:
  card_mod:
    style: |
      ha-card {
        background: var(--glass-bg), var(--glass-glow-cool);
        background-blend-mode: overlay;
      }

# ---------------------------------------------------------------------
# 3) Pill Toggle (compact rounded toggle button)
# ---------------------------------------------------------------------
pill_toggle:
  card_mod:
    style: |
      ha-card {
        border-radius: var(--glass-radius-pill);
        padding: 6px 14px;
        height: auto;
      }

# ---------------------------------------------------------------------
# 4) Mushroom Card — Glass Skin
#    Layers the glass aesthetic on top of mushroom-template-card.
# ---------------------------------------------------------------------
mushroom_glass:
  card_mod:
    style: |
      ha-card {
        background: var(--glass-bg) !important;
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        border: var(--glass-border);
        border-radius: var(--mush-control-border-radius, 20px);
      }
      mushroom-shape-icon {
        --shape-color: rgba(var(--rgb-state, 122, 184, 255), 0.18);
      }

# ---------------------------------------------------------------------
# 5) Sidebar Slim Mode
#    Reduces sidebar width and refines hover state.
#    Apply via theme override or a header-card mod.
# ---------------------------------------------------------------------
sidebar_slim:
  card_mod:
    style:
      ".": |
        :host {
          --mdc-drawer-width: 56px !important;
        }
        ha-sidebar {
          background: var(--sidebar-background-color);
        }

# ---------------------------------------------------------------------
# 6) Header Hide (clean look on wall-tablets)
# ---------------------------------------------------------------------
header_hide:
  card_mod:
    style: |
      app-header {
        display: none;
      }
      hui-view {
        padding-top: 16px !important;
      }

# ---------------------------------------------------------------------
# 7) Notification Toasts (HA built-in / mobile_app)
#    Style the snackbar / toast widget consistently with the theme.
#    Apply via global card-mod-theme entry or as raw lovelace mod.
# ---------------------------------------------------------------------
toast_glass:
  card_mod:
    style:
      ".":
        $: |
          mwc-snackbar {
            --mdc-snackbar-fill-color: var(--ha-toast-background-color, #0f1320) !important;
            --mdc-snackbar-text-color: var(--ha-toast-text-color, #f5f7fa) !important;
            --mdc-snackbar-action-color: var(--mdc-snackbar-action-color, var(--primary-color)) !important;
            border-radius: var(--glass-radius, 18px) !important;
            backdrop-filter: var(--glass-blur, blur(30px));
            box-shadow: var(--glass-shadow);
          }

# ---------------------------------------------------------------------
# 8) Pulse Effect on Active State
#    Gives any card a brief glow pulse when its entity becomes active.
#    Pure CSS — no Pyscript / Automation needed.
# ---------------------------------------------------------------------
pulse_active:
  card_mod:
    style: |
      @keyframes glass-pulse {
        0%   { box-shadow: 0 0 0 0 rgba(var(--rgb-state, 255, 180, 84), 0.45), var(--glass-shadow); }
        70%  { box-shadow: 0 0 0 12px rgba(var(--rgb-state, 255, 180, 84), 0), var(--glass-shadow); }
        100% { box-shadow: 0 0 0 0 rgba(var(--rgb-state, 255, 180, 84), 0), var(--glass-shadow); }
      }
      ha-card[state="on"],
      ha-card[state="home"],
      ha-card[state="playing"],
      ha-card[state="heating"],
      ha-card[state="cooling"] {
        animation: glass-pulse 2.4s ease-out infinite;
      }

# ---------------------------------------------------------------------
# 9) Per-Room Glow (uses room-*-rgb tokens from the theme)
#    Apply different glows to cards based on the room they belong to.
#    Set --rgb-state in the parent card config to switch palette.
# ---------------------------------------------------------------------
room_living:
  card_mod:
    style: |
      ha-card { --rgb-state: var(--room-living-rgb); }

room_bedroom:
  card_mod:
    style: |
      ha-card { --rgb-state: var(--room-bedroom-rgb); }

room_office:
  card_mod:
    style: |
      ha-card { --rgb-state: var(--room-office-rgb); }
