- title: Living
  path: living
  icon: mdi:sofa
  theme: Liquid Glass
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(135deg, rgba(255,180,84,0.18), rgba(255,200,140,0.06)) !important;
            backdrop-filter: blur(40px) saturate(1.6);
