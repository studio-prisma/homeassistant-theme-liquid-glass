            border-radius: 22px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: 16px;
            margin-bottom: 12px;
          }
      card:
        type: custom:mushroom-light-card
        entity: light.all_lights
        name: All Lights
        icon: mdi:lightbulb-group
        show_brightness_control: true
        collapsible_controls: false
        card_mod:
          style: |
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        primary: Living Room
        secondary: '{{ states("light.living_room") | title }}'
        icon: mdi:sofa
        icon_color: '{{ "amber" if is_state("light.living_room","on") else "grey" }}'
        tap_action:
          action: toggle
          entity: light.living_room
        hold_action:
          action: more-info
          entity: light.living_room
        entity: light.living_room
        card_mod:
          style: |
            ha-card {
              background: {% if is_state(config.entity, 'on') %}linear-gradient(135deg, rgba(255,180,84,0.22), rgba(255,200,140,0.08)){% else %}rgba(255,255,255,0.05){% endif %} !important;
              backdrop-filter: blur(30px) saturate(1.4);
              -webkit-backdrop-filter: blur(30px) saturate(1.4);
              border: 1px solid {% if is_state(config.entity, 'on') %}rgba(255,180,84,0.35){% else %}rgba(255,255,255,0.10){% endif %} !important;
              border-radius: 22px !important;
              box-shadow: {% if is_state(config.entity, 'on') %}0 0 24px rgba(255,180,84,0.18), 0 8px 32px rgba(0,0,0,0.25){% else %}0 8px 32px rgba(0,0,0,0.25){% endif %};
              transition: all 0.4s ease;
