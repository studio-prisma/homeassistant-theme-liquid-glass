# =============================================================================
# Liquid Glass Theme — Demo Dashboard (Generic Sample)
# =============================================================================
# Generic showcase dashboard — replace entity IDs below with your own.
# All entities use placeholder names (light.living_room, switch.dishwasher, etc.)
# that you should map to your own setup.
#
# HACS dependencies (install separately): card-mod · mushroom · mod-card ·
# mini-graph-card · mini-media-player · vacuum-card
# =============================================================================

views:
- title: Overview
  path: overview
  icon: mdi:home
  theme: Liquid Glass
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            background: linear-gradient(135deg, rgba(157,130,230,0.20), rgba(122,184,255,0.10)) !important;
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            border: 1px solid rgba(255,255,255,0.15) !important;
            border-radius: 24px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: 18px 24px;
            margin-bottom: 10px;
          }
      card:
        type: horizontal-stack
        cards:
        - type: markdown
          content: |
            # Welcome Home
            ### {{ now().strftime('%A, %B %d') }} · Munich · 22° · Sunny
          card_mod:
            style: |
              ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
              h1 { font-size: 2.0rem !important; font-weight: 600 !important; letter-spacing: -1px !important; margin: 0 0 2px 0 !important; white-space: nowrap !important; }
              h3 { font-weight: 400 !important; opacity: 0.75 !important; margin: 0 !important; white-space: nowrap !important; font-size: 0.95rem !important; }
        - type: markdown
          content: |
            ## {{ states('sensor.power_consumption') }} W
            Total Power · {{ now().strftime('%H:%M') }}
          card_mod:
            style: |
              ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
              h2 { font-size: 1.7rem !important; font-weight: 600 !important; letter-spacing: -0.5px !important; margin: 0 !important; color: #ffb454 !important; }
              p { opacity: 0.7 !important; margin: 2px 0 0 0 !important; font-size: 0.85rem !important; }
        - type: horizontal-stack
          cards:
          - type: custom:mushroom-template-card
            primary: Alex
            secondary: Home
            icon: mdi:account-circle
            icon_color: green
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
          - type: custom:mushroom-template-card
            primary: Sam
            secondary: Away
            icon: mdi:account-circle-outline
            icon_color: grey
            layout: horizontal
            fill_container: true
            card_mod:
              style: |
                ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: action
        icon: mdi:weather-sunny
        content: Good Morning
        icon_color: amber
        tap_action:
          action: toggle
          entity: input_boolean.day_mode
      - type: action
        icon: mdi:weather-night
        content: Good Night
        icon_color: indigo
        tap_action:
          action: toggle
          entity: input_boolean.night_mode
      - type: action
        icon: mdi:home-export-outline
        content: Leaving
        icon_color: red
        tap_action:
          action: call-service
          service: light.turn_off
          data:
            entity_id: light.all_lights
      - type: action
        icon: mdi:movie-open
        content: Movie Night
        icon_color: purple
        tap_action:
          action: toggle
          entity: media_player.tv_living_room
      - type: entity
        entity: switch.main_power
        icon: mdi:power-plug
        icon_color: blue
        content_info: state
      card_mod:
        style: |
          ha-card {
            background: rgba(255,255,255,0.05) !important;
            backdrop-filter: blur(30px) saturate(1.4);
            -webkit-backdrop-filter: blur(30px) saturate(1.4);
            border: 1px solid rgba(255,255,255,0.10) !important;
            border-radius: 18px !important;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding: 8px;
            margin-bottom: 10px;
          }
    - type: horizontal-stack
      cards:
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(255,180,84,0.18), rgba(255,140,84,0.06)) !important;
              backdrop-filter: blur(40px) saturate(1.6);
              -webkit-backdrop-filter: blur(40px) saturate(1.6);
              border: 1px solid rgba(255,180,84,0.22) !important;
              border-radius: 18px !important;
              box-shadow: 0 8px 32px rgba(0,0,0,0.25);
              padding: 12px;
            }
        card:
          type: custom:mini-graph-card
          entities:
          - entity: sensor.power_consumption
            name: Power
          hours_to_show: 24
          points_per_hour: 4
          line_width: 3
          smoothing: true
          line_color: '#ffb454'
          height: 100
          show:
            labels: false
            fill: fade
            legend: false
            name: true
            icon: false
            points: false
            state: true
          card_mod:
            style: |
              ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; }
      - type: custom:mod-card
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, rgba(122,184,255,0.16), rgba(100,220,220,0.04)) !important;
              backdrop-filter: blur(40px) saturate(1.6);
              -webkit-backdrop-filter: blur(40px) saturate(1.6);
              border: 1px solid rgba(122,184,255,0.22) !important;
              border-radius: 18px !important;
              box-shadow: 0 8px 32px rgba(0,0,0,0.25);
              padding: 12px;
            }
        card:
          type: horizontal-stack
          cards:
          - type: gauge
            entity: sensor.bedroom_temperature
            name: Bedroom
            min: 14
            max: 30
            needle: true
            segments:
            - from: 14
              color: '#7ab8ff'
            - from: 18
              color: '#4ad295'
            - from: 24
              color: '#ffb454'
          - type: gauge
            entity: sensor.office_temperature
            name: Office
            min: 14
            max: 30
            needle: true
            segments:
            - from: 14
              color: '#7ab8ff'
            - from: 18
              color: '#4ad295'
            - from: 24
              color: '#ffb454'
          - type: gauge
            entity: sensor.office_humidity
            name: Humidity
            min: 30
            max: 70
            needle: true
            segments:
            - from: 30
              color: '#ff5a6e'
            - from: 40
              color: '#4ad295'
            - from: 60
              color: '#ffb454'
    - type: custom:mod-card
      card_mod:
        style: 'ha-card { background: transparent !important; border: none !important; box-shadow: none !important; height: 10px !important; }'
      card:
        type: markdown
