# =====================================================================
# Liquid Glass Floorplan — Picture-Element Card Snippets
#
# Use the "Liquid Glass Floorplan" theme variant for these.
# Drop into any picture-elements card to add heatmap-style room glows.
# Requires: card-mod (HACS).
# =====================================================================

# ---------------------------------------------------------------------
# Room Marker — translucent rounded glow over a floor-plan image.
# Place an image element with this style at room coordinates.
# Color shifts based on entity state.
# ---------------------------------------------------------------------
room_marker_living:
  type: state-label
  entity: light.living_room
  style:
    top: 35%
    left: 25%
    width: 18%
    height: 22%
    background: "rgba(var(--room-living-rgb, 255, 180, 84), 0.18)"
    border: "var(--floorplan-area-border, 1px solid rgba(255,255,255,0.18))"
    border-radius: "var(--floorplan-area-radius, 16px)"
    backdrop-filter: "var(--floorplan-area-blur, blur(20px) saturate(1.4))"
    color: "var(--primary-text-color)"
    font-size: 12px
    text-align: center
    line-height: 22%
  card_mod:
    style: |
      :host {
        transition: background var(--transition-duration, 300ms) ease;
      }
      :host([state="on"]) {
        background: var(--floorplan-room-active-glow) !important;
      }

# ---------------------------------------------------------------------
# Heatmap Variant — glow intensity scales with sensor value
# ---------------------------------------------------------------------
room_heatmap_office:
  type: custom:button-card
  entity: sensor.office_temperature
  styles:
    card:
      - background: |
          [[[
            const t = parseFloat(entity.state);
            const intensity = Math.min(0.6, Math.max(0.1, (t - 18) / 8));
            return `rgba(122, 184, 255, ${intensity})`;
          ]]]
      - border: "var(--floorplan-area-border)"
      - border-radius: "var(--floorplan-area-radius)"
      - backdrop-filter: "var(--floorplan-area-blur)"
      - height: "100%"
      - color: "var(--primary-text-color)"

# ---------------------------------------------------------------------
# Warning Pulse — for security / leak / smoke
# ---------------------------------------------------------------------
room_warning:
  type: state-label
  entity: binary_sensor.water_leak
  card_mod:
    style: |
      @keyframes warn-pulse {
        0%   { background: var(--floorplan-room-empty-glow); }
        50%  { background: var(--floorplan-room-warning-glow); }
        100% { background: var(--floorplan-room-empty-glow); }
      }
      :host([state="on"]) {
        animation: warn-pulse 1.2s ease-in-out infinite;
      }
