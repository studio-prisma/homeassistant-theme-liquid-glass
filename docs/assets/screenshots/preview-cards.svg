<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Liquid Glass card detail preview">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <radialGradient id="orbA" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#7ab8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7ab8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="glassWarm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffc88c" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="glassCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ab8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#64dcdc" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="glassMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ad295" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#78e6b4" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg2)"/>
  <ellipse cx="600" cy="200" rx="500" ry="320" fill="url(#orbA)"/>

  <!-- Title -->
  <text x="60" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#7ab8ff" letter-spacing="2">CARD ANATOMY</text>
  <text x="60" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Glass-morphism, three states</text>

  <!-- Card A: Idle / passive -->
  <g transform="translate(60, 130)" filter="url(#shadow2)">
    <rect width="340" height="280" rx="22" fill="url(#glass2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(28, 28)">
      <circle cx="22" cy="22" r="22" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="14" y="14" width="16" height="16" rx="3" fill="none" stroke="#f5f7fa" stroke-opacity="0.7" stroke-width="2"/>
      <text x="62" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Idle State</text>
      <text x="62" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.55">passive surface</text>
    </g>
    <text x="28" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">BACKGROUND</text>
    <text x="28" y="164" font-family="ui-monospace, monospace" font-size="12" fill="#f5f7fa" fill-opacity="0.85">rgba(255, 255, 255, 0.05)</text>
    <text x="28" y="190" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">BORDER</text>
    <text x="28" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#f5f7fa" fill-opacity="0.85">rgba(255, 255, 255, 0.10)</text>
    <text x="28" y="234" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">RADIUS</text>
    <text x="28" y="252" font-family="ui-monospace, monospace" font-size="12" fill="#f5f7fa" fill-opacity="0.85">22px</text>
  </g>

  <!-- Card B: Active warm -->
  <g transform="translate(430, 130)" filter="url(#shadow2)">
    <rect width="340" height="280" rx="22" fill="url(#glass2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="340" height="280" rx="22" fill="url(#glassWarm)"/>
    <g transform="translate(28, 28)">
      <circle cx="22" cy="22" r="22" fill="#ffb454" fill-opacity="0.2"/>
      <path d="M 16 16 L 28 16 L 30 24 Q 30 30 22 30 Q 14 30 14 24 Z" fill="#ffb454"/>
      <text x="62" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Active · Warm</text>
      <text x="62" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.55">light, climate-heating</text>
    </g>
    <text x="28" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">GLOW</text>
    <text x="28" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#ffd9a6">rgba(255, 180, 84, 0.22)</text>
    <text x="28" y="190" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">ACCENT</text>
    <text x="28" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#ffb454">#ffb454</text>
    <!-- Slider indicator -->
    <rect x="28" y="240" width="284" height="4" rx="2" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="28" y="240" width="218" height="4" rx="2" fill="#ffb454"/>
    <circle cx="246" cy="242" r="9" fill="#ffffff"/>
  </g>

  <!-- Card C: Active cool -->
  <g transform="translate(800, 130)" filter="url(#shadow2)">
    <rect width="340" height="280" rx="22" fill="url(#glass2)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="340" height="280" rx="22" fill="url(#glassCool)"/>
    <g transform="translate(28, 28)">
      <circle cx="22" cy="22" r="22" fill="#7ab8ff" fill-opacity="0.2"/>
      <circle cx="22" cy="22" r="9" fill="none" stroke="#7ab8ff" stroke-width="2"/>
      <line x1="22" y1="22" x2="22" y2="13" stroke="#7ab8ff" stroke-width="2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="29" y2="22" stroke="#7ab8ff" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="20" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Active · Cool</text>
      <text x="62" y="38" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.55">switch, climate-cooling</text>
    </g>
    <text x="28" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">GLOW</text>
    <text x="28" y="164" font-family="ui-monospace, monospace" font-size="11" fill="#bcd9ff">rgba(122, 184, 255, 0.22)</text>
    <text x="28" y="190" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.45">ACCENT</text>
    <text x="28" y="208" font-family="ui-monospace, monospace" font-size="12" fill="#7ab8ff">#7ab8ff</text>
    <!-- Toggle -->
    <g transform="translate(28, 234)">
      <rect width="56" height="28" rx="14" fill="#7ab8ff"/>
      <circle cx="42" cy="14" r="11" fill="#ffffff"/>
    </g>
    <text x="100" y="252" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.85">Switch on</text>
  </g>
</svg>
