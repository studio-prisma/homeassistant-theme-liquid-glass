<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Liquid Glass theme dashboard preview">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#7ab8ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7ab8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0.7" cy="0.8" r="0.4">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb454" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffc88c" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ab8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64dcdc" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  <ellipse cx="280" cy="200" rx="380" ry="280" fill="url(#orb1)"/>
  <ellipse cx="900" cy="600" rx="320" ry="240" fill="url(#orb2)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="64" height="750" fill="#0a0d18"/>
  <rect x="0" y="0" width="64" height="750" fill="#ffffff" fill-opacity="0.02"/>
  <g transform="translate(20, 80)">
    <rect width="24" height="24" rx="6" fill="#7ab8ff" fill-opacity="0.18"/>
    <circle cx="12" cy="12" r="5" fill="#7ab8ff"/>
  </g>
  <g transform="translate(20, 130)" fill="#f5f7fa" fill-opacity="0.55">
    <rect width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="6" y="9" width="12" height="2" rx="1"/>
    <rect x="6" y="13" width="9" height="2" rx="1"/>
  </g>
  <g transform="translate(20, 180)" fill="#f5f7fa" fill-opacity="0.55">
    <rect width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <g transform="translate(20, 230)" fill="#f5f7fa" fill-opacity="0.55">
    <rect width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>

  <!-- Header bar -->
  <rect x="64" y="0" width="1136" height="68" fill="#0a0d18" fill-opacity="0.6"/>
  <rect x="64" y="67" width="1136" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text x="100" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Home</text>

  <!-- Tab pills -->
  <g transform="translate(190, 22)">
    <rect width="78" height="28" rx="14" fill="#7ab8ff" fill-opacity="0.18"/>
    <text x="39" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#7ab8ff">Overview</text>
  </g>
  <g transform="translate(280, 22)">
    <rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <text x="31" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.65">Energy</text>
  </g>
  <g transform="translate(354, 22)">
    <rect width="62" height="28" rx="14" fill="#ffffff" fill-opacity="0.04"/>
    <text x="31" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.65">Climate</text>
  </g>

  <!-- Avatar -->
  <circle cx="1160" cy="34" r="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="1160" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f5f7fa">SP</text>

  <!-- ===== Cards Grid ===== -->
  <!-- Card 1: Living Room (Light, active amber glow) -->
  <g transform="translate(100, 100)" filter="url(#softShadow)">
    <rect width="340" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="340" height="180" rx="22" fill="url(#amberGlow)" opacity="0.6"/>
    <g transform="translate(24, 24)">
      <circle cx="20" cy="20" r="20" fill="#ffb454" fill-opacity="0.18"/>
      <path d="M 14 14 L 26 14 L 28 22 Q 28 28 20 28 Q 12 28 12 22 Z" fill="#ffb454"/>
      <text x="56" y="18" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Living Room</text>
      <text x="56" y="36" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.65">3 lights · 80%</text>
    </g>
    <!-- Brightness slider -->
    <rect x="24" y="120" width="292" height="4" rx="2" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="24" y="120" width="234" height="4" rx="2" fill="#ffb454"/>
    <circle cx="258" cy="122" r="9" fill="#ffffff"/>
    <text x="24" y="148" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">Brightness</text>
  </g>

  <!-- Card 2: Climate -->
  <g transform="translate(460, 100)" filter="url(#softShadow)">
    <rect width="340" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect width="340" height="180" rx="22" fill="url(#cyanGlow)" opacity="0.5"/>
    <g transform="translate(24, 24)">
      <circle cx="20" cy="20" r="20" fill="#7ab8ff" fill-opacity="0.18"/>
      <path d="M 20 8 L 20 30 M 14 13 L 26 13 M 14 19 L 26 19 M 14 25 L 26 25" stroke="#7ab8ff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="56" y="18" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Climate</text>
      <text x="56" y="36" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.65">Heating · 21.5°C</text>
    </g>
    <text x="24" y="130" font-family="system-ui, sans-serif" font-size="48" font-weight="200" fill="#ffffff">21.5°</text>
    <text x="240" y="130" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.55">target</text>
    <text x="240" y="148" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#ff8b4a">22.0°</text>
  </g>

  <!-- Card 3: Now Playing -->
  <g transform="translate(820, 100)" filter="url(#softShadow)">
    <rect width="280" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(20, 20)">
      <rect width="60" height="60" rx="12" fill="#9d82e6" fill-opacity="0.4"/>
      <rect width="60" height="60" rx="12" fill="url(#cyanGlow)"/>
      <text x="92" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Glass Beach</text>
      <text x="92" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.65">Ambient Vol. 3</text>
      <rect x="92" y="50" width="160" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.1"/>
      <rect x="92" y="50" width="64" height="3" rx="1.5" fill="#9d82e6"/>
    </g>
    <g transform="translate(20, 120)">
      <circle cx="24" cy="24" r="20" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M 16 18 L 16 30 M 20 18 L 20 30" stroke="#f5f7fa" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 26 18 L 34 24 L 26 30 Z" fill="#f5f7fa" fill-opacity="0.7"/>
      <circle cx="100" cy="24" r="22" fill="#9d82e6" fill-opacity="0.18"/>
      <polygon points="92,16 92,32 110,24" fill="#9d82e6"/>
      <circle cx="180" cy="24" r="20" fill="#ffffff" fill-opacity="0.05"/>
      <path d="M 174 18 L 174 30 M 180 18 L 180 30 M 186 18 L 186 30" stroke="#f5f7fa" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Card 4: Front Door (Person home, locked) -->
  <g transform="translate(100, 300)" filter="url(#softShadow)">
    <rect width="220" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(24, 24)">
      <circle cx="20" cy="20" r="20" fill="#4ad295" fill-opacity="0.18"/>
      <rect x="14" y="18" width="12" height="10" rx="1.5" stroke="#4ad295" stroke-width="2" fill="none"/>
      <path d="M 16 18 L 16 14 Q 16 10 20 10 Q 24 10 24 14 L 24 18" stroke="#4ad295" stroke-width="2" fill="none"/>
    </g>
    <text x="24" y="100" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Front Door</text>
    <text x="24" y="120" font-family="system-ui, sans-serif" font-size="12" fill="#4ad295">Locked · Home</text>
    <g transform="translate(24, 138)">
      <rect width="68" height="26" rx="13" fill="#4ad295" fill-opacity="0.18"/>
      <text x="34" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#4ad295">Locked</text>
    </g>
  </g>

  <!-- Card 5: Energy -->
  <g transform="translate(340, 300)" filter="url(#softShadow)">
    <rect width="280" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(24, 24)">
      <circle cx="20" cy="20" r="20" fill="#ffb454" fill-opacity="0.18"/>
      <path d="M 22 10 L 14 22 L 20 22 L 18 30 L 26 18 L 20 18 Z" fill="#ffb454"/>
    </g>
    <text x="24" y="100" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.65">Today</text>
    <text x="24" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="500" fill="#ffffff">12.4 <tspan font-size="18" fill="#f5f7fa" fill-opacity="0.55">kWh</tspan></text>
    <!-- mini bar chart -->
    <g transform="translate(24, 140)">
      <rect x="0" y="14" width="14" height="8" rx="2" fill="#ffb454" fill-opacity="0.4"/>
      <rect x="20" y="10" width="14" height="12" rx="2" fill="#ffb454" fill-opacity="0.5"/>
      <rect x="40" y="6" width="14" height="16" rx="2" fill="#ffb454" fill-opacity="0.6"/>
      <rect x="60" y="2" width="14" height="20" rx="2" fill="#ffb454" fill-opacity="0.7"/>
      <rect x="80" y="0" width="14" height="22" rx="2" fill="#ffb454"/>
      <rect x="100" y="4" width="14" height="18" rx="2" fill="#ffb454" fill-opacity="0.7"/>
      <rect x="120" y="8" width="14" height="14" rx="2" fill="#ffb454" fill-opacity="0.55"/>
      <rect x="140" y="6" width="14" height="16" rx="2" fill="#ffb454" fill-opacity="0.6"/>
      <rect x="160" y="12" width="14" height="10" rx="2" fill="#ffb454" fill-opacity="0.45"/>
      <rect x="180" y="14" width="14" height="8" rx="2" fill="#ffb454" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- Card 6: Sensors -->
  <g transform="translate(640, 300)" filter="url(#softShadow)">
    <rect width="460" height="180" rx="22" fill="url(#glassFill)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="24" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Sensors</text>
    <!-- 4 sensor pills -->
    <g transform="translate(24, 56)">
      <rect width="100" height="52" rx="16" fill="#ffffff" fill-opacity="0.04"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">Outdoor</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#7ab8ff">14.2°</text>

      <rect x="110" width="100" height="52" rx="16" fill="#ffffff" fill-opacity="0.04"/>
      <text x="124" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">Humidity</text>
      <text x="124" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#64dcdc">62%</text>

      <rect x="220" width="100" height="52" rx="16" fill="#ffffff" fill-opacity="0.04"/>
      <text x="234" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">CO₂</text>
      <text x="234" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#4ad295">540</text>

      <rect x="330" width="100" height="52" rx="16" fill="#ffffff" fill-opacity="0.04"/>
      <text x="344" y="22" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">Air</text>
      <text x="344" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#4ad295">Good</text>
    </g>
    <g transform="translate(24, 124)">
      <rect width="412" height="40" rx="14" fill="#ffffff" fill-opacity="0.04"/>
      <text x="14" y="17" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.55">Activity</text>
      <text x="14" y="32" font-family="system-ui, sans-serif" font-size="13" fill="#f5f7fa" fill-opacity="0.85">All quiet · last motion 23 min ago</text>
    </g>
  </g>

  <!-- Footer label -->
  <text x="600" y="720" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f5f7fa" fill-opacity="0.35" letter-spacing="2">LIQUID GLASS — STUDIO-PRISMA</text>
</svg>
