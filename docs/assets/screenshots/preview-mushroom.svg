<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mushroom cards preview with Liquid Glass theme">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <radialGradient id="orbB" cx="0.7" cy="0.6" r="0.5">
      <stop offset="0%" stop-color="#9d82e6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9d82e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)"/>
  <ellipse cx="900" cy="280" rx="500" ry="320" fill="url(#orbB)"/>

  <!-- Title -->
  <text x="60" y="56" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#7ab8ff" letter-spacing="2">MUSHROOM CARDS</text>
  <text x="60" y="86" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="600" fill="#ffffff">Color tokens harmonised with the theme</text>

  <!-- Mushroom card row 1 -->
  <g transform="translate(60, 130)" filter="url(#shadow3)">
    <rect width="200" height="80" rx="20" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="16" fill="#ffb454" fill-opacity="0.2"/>
      <path d="M 18 18 L 30 18 L 32 26 Q 32 32 24 32 Q 16 32 16 26 Z" fill="#ffb454"/>
    </g>
    <text x="80" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Bedside</text>
    <text x="80" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ffb454">on · 60%</text>
  </g>

  <g transform="translate(280, 130)" filter="url(#shadow3)">
    <rect width="200" height="80" rx="20" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="16" fill="#7ab8ff" fill-opacity="0.2"/>
      <circle cx="24" cy="24" r="9" fill="none" stroke="#7ab8ff" stroke-width="2.5"/>
    </g>
    <text x="80" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Office Fan</text>
    <text x="80" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#7ab8ff">running</text>
  </g>

  <g transform="translate(500, 130)" filter="url(#shadow3)">
    <rect width="200" height="80" rx="20" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="16" fill="#9d82e6" fill-opacity="0.2"/>
      <polygon points="20,16 20,32 34,24" fill="#9d82e6"/>
    </g>
    <text x="80" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Sonos</text>
    <text x="80" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#9d82e6">playing</text>
  </g>

  <g transform="translate(720, 130)" filter="url(#shadow3)">
    <rect width="200" height="80" rx="20" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="16" fill="#4ad295" fill-opacity="0.2"/>
      <rect x="18" y="22" width="12" height="10" rx="1.5" stroke="#4ad295" stroke-width="2" fill="none"/>
      <path d="M 20 22 L 20 18 Q 20 14 24 14 Q 28 14 28 18 L 28 22" stroke="#4ad295" stroke-width="2" fill="none"/>
    </g>
    <text x="80" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Front Door</text>
    <text x="80" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#4ad295">locked</text>
  </g>

  <g transform="translate(940, 130)" filter="url(#shadow3)">
    <rect width="200" height="80" rx="20" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.1"/>
    <g transform="translate(16, 16)">
      <rect width="48" height="48" rx="16" fill="#ff5a6e" fill-opacity="0.2"/>
      <path d="M 24 14 L 30 30 L 18 30 Z" stroke="#ff5a6e" stroke-width="2" fill="none"/>
      <line x1="24" y1="20" x2="24" y2="24" stroke="#ff5a6e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="27" r="0.8" fill="#ff5a6e"/>
    </g>
    <text x="80" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Garage</text>
    <text x="80" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#ff5a6e">open</text>
  </g>

  <!-- Row 2 - Color tokens display -->
  <text x="60" y="266" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.55" letter-spacing="2">RGB TOKENS</text>

  <g transform="translate(60, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#ffb454"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">amber</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">255,180,84</text>
  </g>

  <g transform="translate(200, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#7ab8ff"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">blue</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">122,184,255</text>
  </g>

  <g transform="translate(340, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#64dcdc"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">cyan</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">100,220,220</text>
  </g>

  <g transform="translate(480, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#4ad295"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">green</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">74,210,149</text>
  </g>

  <g transform="translate(620, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#ff8b4a"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">orange</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">255,139,74</text>
  </g>

  <g transform="translate(760, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#ff7aa8"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">pink</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">255,122,168</text>
  </g>

  <g transform="translate(900, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#9d82e6"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">purple</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">157,130,230</text>
  </g>

  <g transform="translate(1040, 290)">
    <rect width="120" height="68" rx="16" fill="url(#glass3)" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="20" cy="20" r="8" fill="#ff5a6e"/>
    <text x="36" y="26" font-family="ui-monospace, monospace" font-size="11" fill="#f5f7fa" fill-opacity="0.85">red</text>
    <text x="14" y="50" font-family="ui-monospace, monospace" font-size="10" fill="#f5f7fa" fill-opacity="0.55">255,90,110</text>
  </g>

  <text x="60" y="412" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#f5f7fa" fill-opacity="0.55">All ten <tspan font-family="ui-monospace, monospace">mush-rgb-*</tspan> tokens are predefined and used directly by the Mushroom card library.</text>
</svg>
