# =====================================================================
# Liquid Glass — Custom HA Theme
# Modern glass-morphism aesthetic with layered translucency
#
# Six theme variants:
#   Liquid Glass             auto-switch (OS prefers-color-scheme)
#   Liquid Glass Light only  always light, ignores OS
#   Liquid Glass Dark only   always dark, ignores OS
#   Liquid Glass Compact     always dark + tighter spacing
#   Liquid Glass Sunset      always dark + warm rose/amber palette
#   Liquid Glass Floorplan   always dark + heatmap glow
# =====================================================================

# Liquid Glass — auto-switch
