# =====================================================================
# Liquid Glass — Custom HA Theme
# Modern glass-morphism aesthetic with layered translucency
#
# Three theme variants in this file:
#   - Liquid Glass          (default, dark)
#   - Liquid Glass Light    (light-mode standalone)
#   - Liquid Glass Compact  (dark + tighter spacing for wall-tablets)
#
# Drop into /config/themes/liquid_glass.yaml (HACS does this for you)
# Add `frontend: themes: !include_dir_merge_named themes/` to configuration.yaml
# Restart HA, then select your variant in Profile or per Dashboard.
# =====================================================================

# =====================================================================
# Liquid Glass (Dark — default)
# =====================================================================
Liquid Glass:
  # ----- BASE SURFACES -----
  primary-background-color: "#0a0d18"
  secondary-background-color: "#0f1320"
  card-background-color: "rgba(20, 25, 40, 0.75)"
  ha-card-background: "rgba(20, 25, 40, 0.75)"
  popup-background-color: "#0f1320"
  app-header-background-color: "rgba(10, 13, 24, 0.85)"
  app-header-text-color: "#ffffff"
  sidebar-background-color: "#0a0d18"

  # ----- DIALOG / MODAL (System UI — opaque to keep Settings legible) -----
  mdc-theme-surface: "#0f1320"
  mdc-dialog-content-background: "#0f1320"
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.75)"
  ha-dialog-surface-background: "#0f1320"

  # ----- BACKGROUND IMAGE -----
  # Default: aurora.png — replace via /config/www/ swap, or comment out to disable.
  # Fallback to primary-background-color if file is missing.
  lovelace-background: 'center / cover no-repeat url("/local/liquid_glass_bg.png") fixed, var(--primary-background-color)'

  # ----- TEXT -----
  primary-text-color: "#f5f7fa"
  secondary-text-color: "rgba(245, 247, 250, 0.65)"
  text-primary-color: "#ffffff"
  disabled-text-color: "rgba(245, 247, 250, 0.35)"

  # ----- BRAND / ACCENT -----
  primary-color: "#7ab8ff"           # soft cyan blue accent
  accent-color: "#ffb454"            # warm amber for state-glow
  light-primary-color: "#a8d0ff"
  dark-primary-color: "#3a7fcf"

  # ----- STATE COLORS -----
  state-icon-color: "rgba(245, 247, 250, 0.85)"
  state-icon-active-color: "#ffb454"
  state-icon-unavailable-color: "rgba(245, 247, 250, 0.25)"
  paper-item-icon-color: "rgba(245, 247, 250, 0.75)"
  paper-item-icon-active-color: "#ffb454"

  # Domain state colors (per-domain glow)
  state-light-active-color: "#ffb454"
  state-switch-active-color: "#7ab8ff"
  state-binary_sensor-alerting-color: "#ff5a6e"
  state-climate-heating-color: "#ff8b4a"
  state-climate-cooling-color: "#7ab8ff"
  state-cover-active-color: "#a8d0ff"
  state-fan-active-color: "#64dcdc"
  state-media_player-active-color: "#9d82e6"
  state-person-active-color: "#4ad295"
  state-lock-active-color: "#4ad295"
  state-vacuum-active-color: "#7ab8ff"

  # ----- SEMANTIC -----
  success-color: "#4ad295"
  warning-color: "#ffb454"
  error-color: "#ff5a6e"
  info-color: "#7ab8ff"

  # ----- SIDEBAR REFINEMENT -----
  sidebar-icon-color: "rgba(245, 247, 250, 0.55)"
  sidebar-text-color: "rgba(245, 247, 250, 0.85)"
  sidebar-selected-icon-color: "#7ab8ff"
  sidebar-selected-text-color: "#ffffff"
  sidebar-selected-background-color: "rgba(122, 184, 255, 0.12)"

  # ----- DIVIDERS / BORDERS -----
  divider-color: "rgba(255, 255, 255, 0.08)"
  outline-color: "rgba(255, 255, 255, 0.1)"
  card-background-color-rgb: "255, 255, 255"

  # ----- HA-CARD -----
  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.1)"
  ha-card-box-shadow: "0 8px 32px rgba(0, 0, 0, 0.25)"

  # ----- INTERACTIVE -----
  switch-checked-color: "#7ab8ff"
  switch-unchecked-color: "rgba(255, 255, 255, 0.2)"
  paper-slider-active-color: "#7ab8ff"
  paper-slider-knob-color: "#ffffff"
  paper-slider-pin-color: "#7ab8ff"
  mdc-theme-primary: "#7ab8ff"

  # ----- ANIMATIONS -----
  transition-duration: "200ms"
  transition-timing-function: "cubic-bezier(0.4, 0, 0.2, 1)"

  # ----- MUSHROOM TOKENS -----
  mush-rgb-amber: "255, 180, 84"
  mush-rgb-blue: "122, 184, 255"
  mush-rgb-cyan: "100, 220, 220"
  mush-rgb-green: "74, 210, 149"
  mush-rgb-orange: "255, 139, 74"
  mush-rgb-pink: "255, 122, 168"
  mush-rgb-purple: "157, 130, 230"
  mush-rgb-red: "255, 90, 110"
  mush-rgb-yellow: "255, 200, 100"
  mush-rgb-disabled: "120, 120, 130"
  mush-control-border-radius: "20px"
  mush-control-height: "42px"
  mush-icon-border-radius: "16px"
  mush-card-primary-font-size: "15px"
  mush-card-secondary-font-size: "13px"

  # ----- BUBBLE CARD TOKENS -----
  bubble-main-background-color: "rgba(255, 255, 255, 0.05)"
  bubble-secondary-background-color: "rgba(255, 255, 255, 0.08)"
  bubble-icon-background-color: "rgba(255, 255, 255, 0.08)"
  bubble-button-border-radius: "20px"
  bubble-pop-up-border-radius: "26px"
  bubble-accent-color: "#7ab8ff"

  # ----- TYPOGRAPHY -----
  primary-font-family: "'Inter', system-ui, 'Segoe UI', Roboto, sans-serif"
  paper-font-common-base_-_font-family: "'Inter', system-ui, 'Segoe UI', Roboto, sans-serif"

  # ----- CARD-MOD GLOBAL VARIABLES (used by inline mods in dashboard) -----
  glass-bg: "rgba(255, 255, 255, 0.05)"
  glass-bg-hover: "rgba(255, 255, 255, 0.08)"
  glass-border: "1px solid rgba(255, 255, 255, 0.1)"
  glass-blur: "blur(30px) saturate(1.4)"
  glass-radius: "22px"
  glass-radius-lg: "26px"
  glass-radius-pill: "100px"
  glass-shadow: "0 8px 32px rgba(0, 0, 0, 0.25)"
  glass-glow-warm: "linear-gradient(135deg, rgba(255, 180, 84, 0.22), rgba(255, 200, 140, 0.08))"
  glass-glow-cool: "linear-gradient(135deg, rgba(122, 184, 255, 0.22), rgba(100, 220, 220, 0.08))"
  glass-glow-violet: "linear-gradient(135deg, rgba(157, 130, 230, 0.22), rgba(190, 150, 230, 0.08))"
  glass-glow-mint: "linear-gradient(135deg, rgba(74, 210, 149, 0.22), rgba(120, 230, 180, 0.08))"

  modes:
    light:
      primary-background-color: "#f5f3ee"
      secondary-background-color: "#ffffff"
      card-background-color: "rgba(255, 255, 255, 0.7)"
      ha-card-background: "rgba(255, 255, 255, 0.7)"
      primary-text-color: "#1a1d24"
      secondary-text-color: "rgba(26, 29, 36, 0.65)"
      sidebar-background-color: "#fafaf7"
      sidebar-icon-color: "rgba(26, 29, 36, 0.55)"
      sidebar-text-color: "rgba(26, 29, 36, 0.85)"
      sidebar-selected-background-color: "rgba(58, 127, 207, 0.1)"
      glass-bg: "rgba(255, 255, 255, 0.65)"
      glass-bg-hover: "rgba(255, 255, 255, 0.85)"
      glass-border: "1px solid rgba(0, 0, 0, 0.08)"
      glass-shadow: "0 4px 20px rgba(0, 0, 0, 0.06)"
    dark:
      primary-background-color: "#0a0d18"
      secondary-background-color: "#0f1320"
      card-background-color: "rgba(255, 255, 255, 0.05)"
      ha-card-background: "rgba(255, 255, 255, 0.05)"
      primary-text-color: "#f5f7fa"
      secondary-text-color: "rgba(245, 247, 250, 0.65)"

# =====================================================================
# Liquid Glass Light (standalone light variant)
# =====================================================================
Liquid Glass Light:
  primary-background-color: "#f5f3ee"
  secondary-background-color: "#ffffff"
  card-background-color: "rgba(255, 255, 255, 0.85)"
  ha-card-background: "rgba(255, 255, 255, 0.85)"
  popup-background-color: "#ffffff"
  app-header-background-color: "rgba(245, 243, 238, 0.92)"
  app-header-text-color: "#1a1d24"
  sidebar-background-color: "#fafaf7"

  # Dialog / Modal (System UI — opaque)
  mdc-theme-surface: "#ffffff"
  mdc-dialog-content-background: "#ffffff"
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.45)"
  ha-dialog-surface-background: "#ffffff"

  primary-text-color: "#1a1d24"
  secondary-text-color: "rgba(26, 29, 36, 0.65)"
  text-primary-color: "#0a0d18"
  disabled-text-color: "rgba(26, 29, 36, 0.35)"

  primary-color: "#3a7fcf"
  accent-color: "#d97a3a"
  light-primary-color: "#7ab8ff"
  dark-primary-color: "#1d4f8f"

  state-icon-color: "rgba(26, 29, 36, 0.75)"
  state-icon-active-color: "#d97a3a"

  sidebar-icon-color: "rgba(26, 29, 36, 0.55)"
  sidebar-text-color: "rgba(26, 29, 36, 0.85)"
  sidebar-selected-icon-color: "#3a7fcf"
  sidebar-selected-text-color: "#0a0d18"
  sidebar-selected-background-color: "rgba(58, 127, 207, 0.1)"

  divider-color: "rgba(0, 0, 0, 0.08)"
  outline-color: "rgba(0, 0, 0, 0.1)"

  ha-card-border-radius: "22px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(0, 0, 0, 0.06)"
  ha-card-box-shadow: "0 4px 20px rgba(0, 0, 0, 0.06)"

  switch-checked-color: "#3a7fcf"
  paper-slider-active-color: "#3a7fcf"
  mdc-theme-primary: "#3a7fcf"

  transition-duration: "200ms"
  transition-timing-function: "cubic-bezier(0.4, 0, 0.2, 1)"

  glass-bg: "rgba(255, 255, 255, 0.65)"
  glass-bg-hover: "rgba(255, 255, 255, 0.85)"
  glass-border: "1px solid rgba(0, 0, 0, 0.08)"
  glass-blur: "blur(30px) saturate(1.4)"
  glass-radius: "22px"
  glass-radius-lg: "26px"
  glass-shadow: "0 4px 20px rgba(0, 0, 0, 0.06)"

  primary-font-family: "'Inter', system-ui, 'Segoe UI', Roboto, sans-serif"

# =====================================================================
# Liquid Glass Compact (dark + tighter spacing for wall-tablets)
# =====================================================================
Liquid Glass Compact:
  primary-background-color: "#0a0d18"
  secondary-background-color: "#0f1320"
  card-background-color: "rgba(20, 25, 40, 0.75)"
  ha-card-background: "rgba(20, 25, 40, 0.75)"
  popup-background-color: "#0f1320"
  app-header-background-color: "rgba(10, 13, 24, 0.85)"
  app-header-text-color: "#ffffff"
  sidebar-background-color: "#0a0d18"

  # Dialog / Modal (System UI — opaque)
  mdc-theme-surface: "#0f1320"
  mdc-dialog-content-background: "#0f1320"
  mdc-dialog-scrim-color: "rgba(0, 0, 0, 0.75)"
  ha-dialog-surface-background: "#0f1320"

  primary-text-color: "#f5f7fa"
  secondary-text-color: "rgba(245, 247, 250, 0.65)"
  text-primary-color: "#ffffff"

  primary-color: "#7ab8ff"
  accent-color: "#ffb454"

  state-icon-color: "rgba(245, 247, 250, 0.85)"
  state-icon-active-color: "#ffb454"

  # Tighter card spacing & smaller corners
  ha-card-border-radius: "16px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.1)"
  ha-card-box-shadow: "0 4px 16px rgba(0, 0, 0, 0.2)"

  # Mushroom: smaller controls
  mush-control-border-radius: "14px"
  mush-control-height: "36px"
  mush-icon-border-radius: "12px"
  mush-card-primary-font-size: "14px"
  mush-card-secondary-font-size: "12px"

  # Mushroom RGB tokens (kept identical to dark variant)
  mush-rgb-amber: "255, 180, 84"
  mush-rgb-blue: "122, 184, 255"
  mush-rgb-cyan: "100, 220, 220"
  mush-rgb-green: "74, 210, 149"
  mush-rgb-orange: "255, 139, 74"
  mush-rgb-pink: "255, 122, 168"
  mush-rgb-purple: "157, 130, 230"
  mush-rgb-red: "255, 90, 110"
  mush-rgb-yellow: "255, 200, 100"

  # Bubble: smaller buttons
  bubble-button-border-radius: "14px"
  bubble-pop-up-border-radius: "20px"

  # Glass tokens (compact)
  glass-bg: "rgba(255, 255, 255, 0.05)"
  glass-bg-hover: "rgba(255, 255, 255, 0.08)"
  glass-border: "1px solid rgba(255, 255, 255, 0.1)"
  glass-blur: "blur(24px) saturate(1.3)"
  glass-radius: "16px"
  glass-radius-lg: "20px"
  glass-shadow: "0 4px 16px rgba(0, 0, 0, 0.2)"

  transition-duration: "150ms"

  primary-font-family: "'Inter', system-ui, 'Segoe UI', Roboto, sans-serif"
